<svg xmlns="http://www.w3.org/2000/svg" width="720" height="909" viewBox="0 0 720 909" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#2D4A7C"/></marker>
  <marker id="arrow-second" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#937137"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#555555"/></marker>
</defs>
<rect x="1.5" y="1.5" width="717" height="906" rx="26" fill="#fafaf8" stroke="#d6d6d4" stroke-width="3"/>
<text x="360" y="78" font-family="'Geist Mono', ui-monospace, monospace" font-size="38" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="360" dy="0">How to read a diagram</tspan></text>
<text x="360" y="116" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500" fill="#555555" text-anchor="middle"><tspan x="360" dy="0">Three boxes, one argument</tspan></text>
<rect x="40" y="150" width="600" height="150" rx="18" fill="#FFFFFF" stroke="#2D4A7C" stroke-width="3"/><g transform="translate(340,183.99) scale(0.7)"><path d="M-22,-18 H22 a6,6 0 0 1 6,6 V6 a6,6 0 0 1 -6,6 H-4 L-14,22 V12 H-22 a6,6 0 0 1 -6,-6 V-12 a6,6 0 0 1 6,-6 Z" fill="none" stroke="#2D4A7C" stroke-width="4.43" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="236.10999999999999" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="340" dy="0">Something happens</tspan></text><text x="340" y="270.11" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500" fill="#555555" text-anchor="middle"><tspan x="340" dy="0">a call, a decision, a message</tspan></text><path d="M340,308 L340,340" fill="none" stroke="#2D4A7C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="350" width="600" height="150" rx="18" fill="#FFFFFF" stroke="#2D4A7C" stroke-width="3"/><g transform="translate(340,383.99) scale(0.7)"><path d="M-24,-16 H-6 L0,-9 H24 V20 H-24 Z" fill="none" stroke="#2D4A7C" stroke-width="4.43" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="436.10999999999996" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="340" dy="0">It lands in a file</tspan></text><text x="340" y="470.10999999999996" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500" fill="#555555" text-anchor="middle"><tspan x="340" dy="0">plain text you own, versioned</tspan></text><path d="M340,508 L340,540" fill="none" stroke="#2D4A7C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="40" y="550" width="600" height="150" rx="18" fill="#ece7dd" stroke="#937137" stroke-width="3"/><g transform="translate(340,583.99) scale(0.7)"><rect x="-26" y="-20" width="52" height="40" rx="6" fill="none" stroke="#937137" stroke-width="4.43" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14,-4 L-5,3 L-14,10 M0,12 H12" fill="none" stroke="#937137" stroke-width="4.43" stroke-linecap="round" stroke-linejoin="round"/></g><text x="340" y="636.1100000000001" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="340" dy="0">A machine reads it</tspan></text><text x="340" y="670.1100000000001" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500" fill="#555555" text-anchor="middle"><tspan x="340" dy="0">before it acts, on every run</tspan></text><path d="M644,625 H666 V225 H652" fill="none" stroke="#937137" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow-second)"/><text x="360" y="750" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="500" fill="#937137" text-anchor="middle"><tspan x="360" dy="0">and what it reads decides</tspan><tspan x="360" dy="30.7">what is worth capturing next</tspan></text><path d="M40,824.72 H680" stroke="#c0c0be" stroke-width="2" stroke-linecap="round"/><text x="360" y="868.72" font-family="'Geist Mono', ui-monospace, monospace" font-size="26" font-weight="600" fill="#1a1a1a" text-anchor="middle" font-style="italic"><tspan x="360" dy="0">Every diagram here is drawn in code.</tspan></text>
</svg>
