<svg xmlns="http://www.w3.org/2000/svg" width="900" height="632" viewBox="0 0 900 632" role="img">
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#2D4A7C"/></marker>
  <marker id="arrow-second" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#937137"/></marker>
  <marker id="arrow-muted" viewBox="0 0 10 10" refX="7.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1 L9,5 L1,9 Z" fill="#555555"/></marker>
</defs>
<rect x="1.5" y="1.5" width="897" height="629" rx="26" fill="#fafaf8" stroke="#d6d6d4" stroke-width="3"/>
<text x="450" y="78" font-family="'Geist Mono', ui-monospace, monospace" font-size="38" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="450" dy="0">How to read a diagram here</tspan></text>
<text x="450" y="116" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="21" font-weight="500" fill="#555555" text-anchor="middle"><tspan x="450" dy="0">Three boxes, one argument, no image model</tspan></text>
<text x="450" y="160" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-weight="700" fill="#555555" text-anchor="middle" letter-spacing="1.9"><tspan x="450" dy="0">THE SAMPLE DIAGRAM, DRAWN IN CODE</tspan></text><rect x="56" y="200" width="232" height="196" rx="18" fill="#FFFFFF" stroke="#2D4A7C" stroke-width="3"/><text x="172" y="278.41999999999996" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="172" dy="0">Something happens</tspan></text><text x="172" y="304.41999999999996" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#555555" text-anchor="middle"><tspan x="172" dy="0">a call, a decision,</tspan><tspan x="172" dy="20.5">a draft, a message</tspan></text><g transform="translate(172,246) scale(0.82)"><path d="M-22,-18 H22 a6,6 0 0 1 6,6 V6 a6,6 0 0 1 -6,6 H-4 L-14,22 V12 H-22 a6,6 0 0 1 -6,-6 V-12 a6,6 0 0 1 6,-6 Z" fill="none" stroke="#2D4A7C" stroke-width="3.78" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M300,298 L322,298" fill="none" stroke="#2D4A7C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="334" y="200" width="232" height="196" rx="18" fill="#FFFFFF" stroke="#2D4A7C" stroke-width="3"/><text x="450" y="278.41999999999996" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="450" dy="0">It lands in a file</tspan></text><text x="450" y="304.41999999999996" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#555555" text-anchor="middle"><tspan x="450" dy="0">plain text you own,</tspan><tspan x="450" dy="20.5">in version control</tspan></text><g transform="translate(450,246) scale(0.82)"><path d="M-24,-16 H-6 L0,-9 H24 V20 H-24 Z" fill="none" stroke="#2D4A7C" stroke-width="3.78" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M578,298 L600,298" fill="none" stroke="#2D4A7C" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/><rect x="612" y="200" width="232" height="196" rx="18" fill="#ece7dd" stroke="#937137" stroke-width="3"/><text x="728" y="278.41999999999996" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="#1a1a1a" text-anchor="middle"><tspan x="728" dy="0">A machine reads it</tspan></text><text x="728" y="304.41999999999996" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="500" fill="#555555" text-anchor="middle"><tspan x="728" dy="0">before it acts,</tspan><tspan x="728" dy="20.5">on every later run</tspan></text><g transform="translate(728,246) scale(0.82)"><rect x="-26" y="-20" width="52" height="40" rx="6" fill="none" stroke="#937137" stroke-width="3.78" stroke-linecap="round" stroke-linejoin="round"/><path d="M-14,-4 L-5,3 L-14,10 M0,12 H12" fill="none" stroke="#937137" stroke-width="3.78" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M728,404 V482 H172 V412" fill="none" stroke="#937137" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="10 8" marker-end="url(#arrow-second)"/><text x="450" y="468" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-size="17" font-weight="500" fill="#937137" text-anchor="middle"><tspan x="450" dy="0">and what it reads decides what is worth capturing next</tspan></text><path d="M56,548 H844" stroke="#c0c0be" stroke-width="2" stroke-linecap="round"/><text x="450" y="592" font-family="'Geist Mono', ui-monospace, monospace" font-size="20" font-weight="600" fill="#1a1a1a" text-anchor="middle" font-style="italic"><tspan x="450" dy="0">Every diagram here is drawn in diagrams/build.mjs.</tspan></text>
</svg>
